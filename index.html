<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile GPS Tracker</title>
</head>
<body>
<h2>Mobile GPS Tracker</h2>
<button onclick="startTracking()">
Start Tracking</button>
<p>Status: <span id="status">Waiting...</span></p>
<p>Latitude: <span id="lat">--</span></p><p>Longitude: <span id="lon">--</span></p>
<script>
var apiKey = "
CXRFAZTGIKL3QJ5C";var watchID;
function startTracking(){
document.getElementById("status").innerHTML="Tracking Started";
watchID = navigator.geolocation.watchPosition(updateLocation, error, {enableHighAccuracy:true});
}
function updateLocation(position){
var lat = position.coords.latitude;var lon = position.coords.longitude;
/* show live coordinates */document.getElementById("lat").innerHTML = lat;document.getElementById("lon").innerHTML = lon;
/* send to ThingSpeak */var url="https://api.thingspeak.com/update?api_key="+apiKey+"&field1="+lat+"&field2="+lon;
fetch(url);
document.getElementById("status").innerHTML="Location Sent";
}
function error(err){
document.getElementById("status").innerHTML="GPS Error";
}
</script>
</body>
</html>
