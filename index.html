<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile GPS Tracker</title>

<style>
body{
font-family: Arial;
text-align:center;
padding:30px;
}

button{
padding:12px 20px;
font-size:18px;
background:#4CAF50;
color:white;
border:none;
border-radius:5px;
}

p{
font-size:18px;
}
</style>

</head>

<body>

<h2>📍 Mobile GPS Tracker</h2>

<button onclick="startTracking()">Start Tracking</button>

<p>Status: <span id="status">Waiting...</span></p>
<p>Latitude: <span id="lat">--</span></p>
<p>Longitude: <span id="lon">--</span></p>

<script>

var apiKey = "CXRFAZTGIKL3QJ5C";
var watchID = null;

function startTracking(){

if(navigator.geolocation){

document.getElementById("status").innerHTML="Requesting GPS permission...";

watchID = navigator.geolocation.watchPosition(
updateLocation,
error,
{
enableHighAccuracy:true,
maximumAge:0,
timeout:5000
}
);

}else{
document.getElementById("status").innerHTML="Geolocation not supported.";
}

}

function updateLocation(position){

var lat = position.coords.latitude;
var lon = position.coords.longitude;

document.getElementById("lat").innerHTML = lat;
document.getElementById("lon").innerHTML = lon;

document.getElementById("status").innerHTML="Location captured ✔";

sendToThingSpeak(lat,lon);

}

function sendToThingSpeak(lat,lon){

var url = "https://api.thingspeak.com/update?api_key="+apiKey+"&field1="+lat+"&field2="+lon;

fetch(url)
.then(response => {
document.getElementById("status").innerHTML="Location sent to ThingSpeak ✔";
})
.catch(error => {
document.getElementById("status").innerHTML="Error sending data";
});

}

function error(err){

switch(err.code){
case err.PERMISSION_DENIED:
document.getElementById("status").innerHTML="Permission denied";
break;

case err.POSITION_UNAVAILABLE:
document.getElementById("status").innerHTML="Location unavailable";
break;

case err.TIMEOUT:
document.getElementById("status").innerHTML="Request timeout";
break;

default:
document.getElementById("status").innerHTML="Unknown error";
}

}

</script>

</body>
</html>
